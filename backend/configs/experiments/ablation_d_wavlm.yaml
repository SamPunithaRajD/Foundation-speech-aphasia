# EXPERIMENT D — foundation-model ablation: Model C with wavlm in place of wav2vec 2.0
experiment: D_multimodal_wavlm
dataset_config: configs/datasets/aphasiabank.yaml
seed: 13
min_participants: 20
split: {val_fraction: 0.15, test_fraction: 0.15, seed: 13, stratify: true, cv_folds: 5}
features: {groups: ["embedding:wavlm", language, acoustic], language_source: whisper, audio_scope: speaker_utterances}
model: {type: fusion_transformer, d_model: 32, n_heads: 4, n_layers: 1, ff: 64, dropout: 0.3, lr: 0.0005, weight_decay: 0.05, epochs: 300, batch_size: 16, patience: 30, loss: huber, grad_clip: 1.0}
