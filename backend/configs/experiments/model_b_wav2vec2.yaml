# MODEL B — speech foundation model: wav2vec 2.0 embedding (768) -> MLP regression head
# One small hidden layer (64) with dropout: ~49k parameters. Compare against ablation_b_wav2vec2_ridge.yaml,
# which is the lower-variance choice when participants are few.
experiment: B_wav2vec2
dataset_config: configs/datasets/aphasiabank.yaml
seed: 13
min_participants: 20
split: {val_fraction: 0.15, test_fraction: 0.15, seed: 13, stratify: true, cv_folds: 5}
features: {groups: ["embedding:wav2vec2"], language_source: whisper, audio_scope: speaker_utterances}
model: {type: mlp, hidden: [64], dropout: 0.3, lr: 0.001, weight_decay: 0.05, epochs: 300, batch_size: 16, patience: 30, loss: huber, grad_clip: 1.0}
